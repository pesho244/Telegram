<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моля, потвърдете, че сте човек</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.8)),
        url('bg.jpg') center / cover no-repeat fixed,
        #0b0f14;
    }
    .container {
      width: 100%;
      max-width: 420px;
      margin: 20px;
      padding: 32px 24px;
      text-align: center;
      background: rgba(10, 14, 20, .55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }
    h2 { margin: 0 0 24px; font-size: 22px; line-height: 1.3; }
    .cf-turnstile { display: flex; justify-content: center; }
    #telegram-btn {
      display: none;
      margin-top: 24px;
      padding: 14px 28px;
      background: #0088cc;
      color: #fff;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 14px rgba(0,136,204,.5);
    }
    #error-msg { color: #ff6b6b; margin-top: 15px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Потвърдете проверката, за да продължите към Telegram</h2>

    <div class="cf-turnstile"
         data-sitekey="0x4AAAAAAFTn4bc_vCjyAyGB"
         data-theme="dark"
         data-callback="onTurnstileSuccess"></div>

    <div id="error-msg">Проверката е невалидна. Моля, опитайте пак.</div>
    <a id="telegram-btn" href="#" target="_blank" rel="noopener">Влез в Telegram канала</a>
  </div>

  <script>
    async function onTurnstileSuccess(token) {
      const errorMsg = document.getElementById('error-msg');
      errorMsg.style.display = 'none';
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        if (data.success) {
          const btn = document.getElementById('telegram-btn');
          btn.href = data.telegramUrl;
          btn.style.display = 'inline-block';
        } else {
          errorMsg.style.display = 'block';
        }
      } catch (e) {
        errorMsg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
