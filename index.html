<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моля, потвърдете, че сте човек</title>
    <!-- Включваме скрипта на Cloudflare Turnstile -->
    <script src="https://cloudflare.com" async defer></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6; margin: 0; }
        .container { text-align: center; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h2 { color: #333; margin-bottom: 20px; }
        #telegram-btn { display: none; margin-top: 20px; padding: 12px 24px; background-color: #0088cc; color: white; text-decoration: none; border-radius: 25px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 10px rgba(0,136,204,0.3); }
        .error { color: red; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Потвърдете проверката, за да продължите към Telegram</h2>
    
    <!-- ТУК СЕ СЛАГА ТВОЯТ SITE KEY -->
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFTn4bc_vCjyAyGB" data-callback="onTurnstileSuccess"></div>
    
    <div id="error-msg" class="error">Проверката е невалидна. Моля, опитайте пак.</div>
    <a id="telegram-btn" href="#" target="_blank">Влез в Telegram канала</a>
</div>

<script>
    // Тази функция се извиква автоматично при успешна CAPTCHA
    async function onTurnstileSuccess(token) {
        const errorMsg = document.getElementById('error-msg');
        errorMsg.style.display = 'none';

        // Изпращаме токена към нашата сървърна Cloudflare функция за проверка
        const response = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token })
        });

        const data = await response.json();

        if (data.success) {
            // Ако сървърът каже "ДА", показваме бутона и му слагаме истинския линк
            const btn = document.getElementById('telegram-btn');
            btn.href = data.telegramUrl;
            btn.style.display = 'inline-block';
        } else {
            errorMsg.style.display = 'block';
        }
    }
</script>

</body>
</html>
