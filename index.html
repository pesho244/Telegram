<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моля, потвърдете, че сте човек</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f7f6; margin: 0; }
    .container { text-align: center; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,.1); max-width: 400px; width: 100%; }
    h2 { color: #333; margin-bottom: 20px; }
    #telegram-btn { display: none; margin-top: 20px; padding: 12px 24px; background: #0088cc; color: #fff; text-decoration: none; border-radius: 25px; font-weight: bold; }
    #error-msg { color: red; margin-top: 15px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Потвърдете проверката, за да продължите към Telegram</h2>

    <div class="cf-turnstile"
         data-sitekey="0x4AAAAAAFTn4bc_vCjyAyGB"
         data-callback="onTurnstileSuccess"></div>

    <div id="error-msg">Проверката е невалидна. Моля, опитайте пак.</div>
    <a id="telegram-btn" href="#" target="_blank" rel="noopener">Влез в Telegram канала</a>
  </div>

  <script>
    async function onTurnstileSuccess(token) {
      const errorMsg = document.getElementById('error-msg');
      errorMsg.style.display = 'none';
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        if (data.success) {
          const btn = document.getElementById('telegram-btn');
          btn.href = data.telegramUrl;
          btn.style.display = 'inline-block';
        } else {
          errorMsg.style.display = 'block';
        }
      } catch (e) {
        errorMsg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
